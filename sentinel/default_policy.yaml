# GoodAI Sentinel — AI-agent guardrail policy.
# Deny by default. Everything an agent is NOT explicitly granted is refused.
# Edit freely; the engine reloads on restart. Keep this file itself in deny_targets.

kill_switch: false          # flip to true to freeze ALL agent actions instantly

# Patterns that are NEVER allowed for any agent, regardless of capabilities.
# These target the classic failure modes: self-preservation, defense evasion,
# destruction, exfiltration, and privilege escalation.
forbidden_patterns:
  disable_defense:    "(stop|kill|disable|uninstall|mask)\\s+.*(sentinel|guardrail|antivirus|firewall|auditd|ufw|iptables|selinux|apparmor)"
  self_modify:        "(edit|write|modify|patch|replace).*(agent_guardrails|guardrail\\.py|sentinel/|own\\s+(code|weights|prompt))"
  destroy_data:       "rm\\s+-rf\\s+/|mkfs\\.|dd\\s+if=.*of=/dev|shred\\s|format\\s+[a-z]:|drop\\s+(database|table)\\s+(?!temp)"
  exfiltrate:         "(curl|wget|scp|rsync|nc)\\s+.*(\\.env|id_rsa|shadow|credentials|token|\\.pem)"
  download_exec:      "(curl|wget)[^|]*\\|\\s*(ba)?sh"
  reverse_shell:      "nc\\s+.*-e\\s|/dev/tcp/|mkfifo"
  privesc:            "sudo\\s+su|pkexec|chmod\\s+[ug]\\+s"
  credential_access:  "/etc/shadow|/etc/sudoers|authorized_keys|\\.aws/credentials|\\.kube/config"
  spawn_unbounded:    "(spawn|fork|replicate|copy).*(itself|self|agents?\\s+x?\\d{2,})"
  control_hardware:   "(flash|overwrite|write).*(firmware|bios|uefi|bootloader|eeprom)"
  disable_logging:    "(rm|truncate|clear|disable).*(audit|syslog|journal|/var/log)"
  # --- added from Anthropic threat report, Sep 2026 ---
  cloud_metadata:     "169\\.254\\.169\\.254|metadata\\.google\\.internal|/latest/meta-data"
  env_dump:           "/proc/self/environ|\\bprintenv\\b|os\\.environ|Get-ChildItem\\s+env:|\\$ENV:|\\benv\\b\\s*(\\||>)"
  ai_key_exfil:       "(curl|wget|scp|rsync|nc|Invoke-WebRequest|irm|iwr)\\s+.*(sk-ant-|sk-[A-Za-z0-9]{32}|AKIA[0-9A-Z]{16}|ghp_|xox[baprs]-|api[_-]?key)"
  disable_updates:    "(stop|disable|mask|config).*(wuauserv|unattended-upgrades|softwareupdate|Set-MpPreference)"
  register_device:    "(register|enroll|join).*(device|tenant).*(actor|attacker|our|my)|deviceRegistration|/devicemanagement/"
  webshell:           "(mu-plugins|wp-content/uploads).*\\.(php|phtml)|\\.(woff2?|ttf|css)\\.php"

# Applied to every agent unless overridden in `agents`.
  ws_destroy:         "r[\\s\\u00a0\"'`]*m[\\s\\u00a0]*-[\\s\\u00a0]*rf|of[\\s\\u00a0]*=[\\s\\u00a0]*/dev/"
  ws_disable_defense: "s[\\s\\u00a0\"'`]*t[\\s\\u00a0\"'`]*o[\\s\\u00a0\"'`]*p[\\s\\u00a0]+\\w*def"
  ws_ransomware:      "d[\\s\\u00a0\"'`]*e[\\s\\u00a0\"'`]*l[\\s\\u00a0\"'`]*e[\\s\\u00a0\"'`]*t[\\s\\u00a0\"'`]*e[\\s\\u00a0]+shadow"

defaults:
  capabilities: ["read:*", "search:*", "summarize:*"]
  deny_targets:
    - "/etc/*"
    - "/boot/*"
    - "/root/*"
    - "*/.ssh/*"
    - "*/.env"
    - "*/policy/agent_guardrails.yaml"
    - "*/sentinel/*"
  rate_limit: { max: 60, window_s: 60 }
  budget: 100.0
  require_approval: ["delete:*", "deploy:*", "send:*", "pay:*", "shell:*", "spawn:*", "register:*"]

# Per-agent overrides. Keys are glob patterns on agent_id.
agents:
  "coder-*":
    capabilities: ["read:*", "write:file", "run:test", "run:lint", "shell:*"]
    allow_targets: ["/workspace/*", "/tmp/*"]
    require_approval: ["shell:*", "delete:*", "write:*.yaml", "write:*.yml"]
    rate_limit: { max: 120, window_s: 60 }
    budget: 500.0

  "ops-*":
    capabilities: ["read:*", "restart:service", "scale:*", "deploy:*"]
    require_approval: ["deploy:prod*", "scale:*"]
    budget: 50.0

  "untrusted-*":
    capabilities: ["read:public/*"]
    rate_limit: { max: 10, window_s: 60 }
    budget: 5.0
